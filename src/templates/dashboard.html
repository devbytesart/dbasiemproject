<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Dashboard</title>

    <link rel="stylesheet" href="/static/css/theme.css">
    <!-- Fomantic UI CSS -->
    <link rel="stylesheet" href="static/css/semantic.min.css">
    <!-- DataTables CSS (compatible with Fomantic UI) -->
    <link rel="stylesheet" href="static/css/semanticui.min.css">
    <!-- <link rel="stylesheet" href="static/css/datetimepicker.css"> -->
    <link rel="stylesheet" href="static/css/inputs.css">

    <!-- jQuery -->
    <script src="static/javascript/external/jquery-3.6.0.min.js"></script>
    <!-- DataTables JS -->
    <script src="static/javascript/external/jquery.dataTables.min.js"></script>
    <!-- DataTables Semantic UI integration -->
    <script src="static/javascript/external/dataTables.semanticui.min.js"></script>
    <!-- Fomantic UI JS -->
    <script src="static/javascript/external/semantic.min.js"></script>
    <!-- DataTables Semantic UI integration -->
    <script src="static/javascript/external/dataTables.semanticui.min.js"></script>
    <!-- Graph -->
    <script src="static/javascript/external/chart.umd.min.js"></script>
    <script type="module" src="static/javascript/external/chart.min.js"></script>   
    <script src="static/javascript/external/chartjs-adapter-date-fns.bundle.min.js"></script>

    <!-- Export -->
    <script src="static/javascript/external/html2canvas.min.js"></script>

    <!-- Custom -->
    <script src="/static/javascript/utils.js"></script>
    <script src="/static/javascript/help.js"></script>
    <!-- <script src="/static/javascript/dropdownlist.js"></script> -->
     <script src="/static/javascript/tags.js"></script>
    <script src="/static/javascript/datetimepicker.js"></script>
    <script src="/static/javascript/graph_class.js"></script>
    <script src="/static/javascript/table_class.js"></script>
    <script src="/static/javascript/widgets.js"></script>
    <script src="/static/javascript/dashboard_class.js"></script>
    <script src="/static/javascript/result_interpreter.js"></script>
    <script src="/static/javascript/soarcard.js"></script>
    <script src="/static/javascript/dashboard.js"></script>
    

    <script src="/static/javascript/external/chartjs-plugin-datalabels.js"></script>


</head>
<body>    
    <div class="layout">
        <aside id="menu">
                <!-- Left menu -->
                {% include "menu.html" %}

        </aside>
        <main id="content" style="width: 120%;">
            <!-- Header -->
            {% include "header.html" %}
            
            <!-- Central dashboard zone -->
            <div class="workspace">

                <button id="searchformbutton" class="ui button collapsible" style="margin-bottom: 10px;margin-top: -10px;">Show/Hide Panel</button>
                <form id="searchForm" class="ui form collapsed-content" style="overflow: auto;white-space: nowrap;">
                    <div class="fields">

                        <div class="field">
                            <div id="selectindex"></div>
                        </div>
                        <div class="field">
                            <div id="selecttenant"></div>
                        </div>
                        <div class="field">
                            <div id="selecttechnology"></div>
                        </div>
                        <div class="field">
                            <div id="selectdashboard"></div>
                        </div>

                        <!-- <div class="field">
                            <date-time-picker name="Start Date" id="startPicker"></date-time-picker>

                        </div>
                        <div class="field">
                            <date-time-picker name="End Date" id="endPicker"></date-time-picker>
                        </div> -->

                        <div class="field">
                            <label for="refresh-interval">Refresh Interval (s):</label>
                            <input type="number" id="refresh-interval" min="5" value="30">
                            <br/>
                            <!--  TODO add the limit in the result function -->
                            <label for="limit-results">Limit Results:</label>
                            <select id="limit-results" class="ui fluid search dropdown">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                                <option value="500">500</option>
                                <option value="1000">1000</option>
                                <option value="10000">10000</option>
                            </select>
                        </div>

                        <div class="field">
                            <button type="button" class="styled-button toggle-legend" id="button-legend" style="height:45%;width:100%;margin-bottom:10px;">Legend</button><br/>
                            <button type="button" class="styled-button toggle-data-labels" id="button-value" style="height:45%;width:100%;margin-top:10px;">Values</button>
                        </div>

                        <div class="field">
                            <button type="button" class="styled-button" id="refresh-dashboard">Refresh</button>
                        </div>
                       
                        <div class="field">
                            <button type="button" id="downloadResults" class="styled-button">Export</button>
                        </div>

                        <div class="field">
                            <div id="loadingSpinner" class="ui active inline loader" style="display: none;"><h4 id="loadingSpinnerLabel" style="margin-left: 50px;width:200px;"></h4></div>
                        </div>

                </form>
            </div>
        </div>
        <div id="dashboard-zone" class="dashboard-zone"></div>
        </main>
    </div>
    <script>
        $('button.collapsible').on('click', function() {
            $(this).next('.collapsed-content').slideToggle();
        });
    </script>
</body>
</html>
