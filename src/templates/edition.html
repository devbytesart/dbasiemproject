<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edition</title>
    
    <!-- Fomantic UI CSS -->
    <link rel="stylesheet" href="static/css/semantic.min.css">
    <!-- DataTables CSS (compatible with Fomantic UI) -->
    <link rel="stylesheet" href="static/css/semanticui.min.css">

    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/edition.css">
    <link rel="stylesheet" href="/static/css/inputs.css">
    <link rel="stylesheet" href="/static/css/datetimepicker.css">

    <!-- jQuery -->
    <script src="static/javascript/external/jquery-3.6.0.min.js"></script>
    <!-- Fomantic UI JS -->
    <script src="static/javascript/external/semantic.min.js"></script>

    <!-- Internal inclusion -->
    <script src="/static/javascript/utils.js"></script>
    <script src="/static/javascript/widgets.js"></script>
    <script src="/static/javascript/help.js"></script>
    <script src="/static/javascript/dropdownlist.js"></script>
    <script src="/static/javascript/datetimepicker.js"></script>
    <script src="/static/javascript/tags.js"></script>

</head>
<body>
    <div class="layout">
        <aside id="menu">  
                <!-- Left menu -->
                {% include "menu.html" %}

                <h3>Widgets</h3>
                <div class="widget-list">
                    <div class="widget-edit" draggable="true" data-type="text">Text Widget</div>
                    <div class="widget-edit" draggable="true" data-type="query">Query Widget</div>
                    <div class="widget-edit" draggable="true" data-type="image">Image Widget</div>
                    <div class="widget-edit" draggable="true" data-type="markdown">Markdown Widget</div>
                    <div class="widget-edit" draggable="true" data-type="soar">SOAR Widget</div>
                </div>

        </aside>
        <main id="content">
            <!-- Header -->
            {% include "header.html" %}
            <div class="workspace">
                <button id="searchformbutton" class="ui button collapsible" style="margin-bottom: 10px;margin-top: -10px;">Show/Hide Panel</button>
                <form id="searchForm" class="ui form collapsed-content" style="overflow: auto;white-space: nowrap;">
                    <div class="fields">
                        <div class="field">
                            <!-- <label for="dashboard-name">TO SAVE TITLE:</label> -->
                            <!-- <input type="text" id="dashboard-name" placeholder="Report Name"> -->
                        </div> 
                        <div class="field">
                            <div class="fields">
                                <!-- Button/Checkbox -->
                                <div style="margin-top: 10px;">
                                    <label class="toggle-container">Report
                                        <br/>
                                        <input id="isreport" type="checkbox" />
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                                <div class="field">
                                    <div id="selectindex"></div>
                                </div>
                                <div class="field">
                                    <div id="selecttenant"></div>
                                </div>
                                <div class="field">
                                    <div id="selecttechnology"></div>
                                </div>
                                <div class="field">
                                    <div id="selectdashboard"></div>
                                </div>
                            </div>
                        </div>
                        <div class="workspace">  
                            <button type="button" id="save-dashboard" class="styled-button">Save</button>
                        </div>
                    </div>
                </form>
            </div>
            <!-- Browsing tab
            <div class="tabs">
                <button class="tab-button active" data-target="dashboard-tab">Dashboard</button>
                <button class="tab-button" data-target="report-tab">Report</button>
            </div> -->
        
            <!-- Tab content -->
            <!-- <div class="tab-content" id="dashboard-tab">
                <div class="workspace">  
                        <div class="fields">
                            <div class="field">
                                <button type="button" id="save-dashboard" class="styled-button">Save</button>
                            </div>
                        </div>
                </div>
            </div>
        
            <div class="tab-content" id="report-tab" style="display: none;">
                <div class="workspace">  
                    <button type="button" id="save-report" class="styled-button">Save</button>
                </div>
            </div> -->

            <!-- <div class="tab-content" id="dashboard-tab">

            </div> -->
        
            <!--Creation wzone for widget  -->
            <div id="drop-zone" class="drop-zone" style="height:80%;"></div>
        </main>

        <aside id="menu">
            <h2>Configuration</h2>
            <form id="config-form">
                <label for="widget-id">Widget ID:</label>
                <input type="text" id="widget-id" name="widget-id" readonly><br>

                <label for="widget-name">Widget Name:</label>
                <input type="text" id="widget-name" name="widget-name"><br>

                <label for="command">Command:</label>
                <input type="text" id="command" name="command"><br>
            </form>
        </aside>
        <script src="/static/javascript/edition.js"></script>
    </div>
</body>
</html>
