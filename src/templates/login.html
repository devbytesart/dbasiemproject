<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/inputs.css">
</head>
<body>
    <div class="layout">
        <!-- Left menu -->
        <aside id="menu">
        </aside>
        <!-- Main content -->
        <main id="content">
            <h1 style="text-align: center;"><img src="/static/media/dbart.png" alt="DevBytesArt®" style="width: 128px;"></h1>
            <form method="POST" id="config-form">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="styled-button" style="width: 100%;">Login</button>
            </form>
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
        </main>
        <!-- right panel -->
        <aside id="menu">
        </aside>
    </div>
</body>
</html>
