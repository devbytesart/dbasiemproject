<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>

    <link rel="stylesheet" href="static/css/theme.css">
    <link rel="stylesheet" href="static/css/help.css">
    <link rel="stylesheet" href="static/css/suggestions.css">
    <!-- Fomantic UI CSS -->
    <link rel="stylesheet" href="static/css/semantic.min.css">
    <!-- DataTables CSS (compatible with Fomantic UI) -->
    <link rel="stylesheet" href="static/css/semanticui.min.css">
    <!-- File CSS externe -->
    <!-- <link rel="stylesheet" href="static/style.css"> -->
    <link rel="stylesheet" href="static/css/inputs.css">
    <!-- jQuery -->
    <script src="static/javascript/external/jquery-3.6.0.min.js"></script>
    <!-- DataTables JS -->
    <script src="static/javascript/external/jquery.dataTables.min.js"></script>
    <!-- DataTables Semantic UI integration -->
    <script src="static/javascript/external/dataTables.semanticui.min.js"></script>
    <!-- Fomantic UI JS -->
    <script src="static/javascript/external/semantic.min.js"></script>
    <!-- Graph -->
    <script src="static/javascript/external/chart.umd.min.js"></script>
    <script type="module" src="static/javascript/external/chart.min.js"></script>   
    <script src="static/javascript/external/chartjs-adapter-date-fns.bundle.min.js"></script>

    <!-- Export -->
    <script src="static/javascript/external/html2canvas.min.js"></script>
    <script src="static/javascript/external/jspdf.min.js"></script>

    <!-- Fichiers JS externes -->
    <script src="/static/javascript/utils.js"></script>
    <script src="/static/javascript/help.js"></script>
    <script src="/static/javascript/tags.js"></script>
    <!-- <script src="/static/javascript/dropdownlist.js"></script> -->
    <script src="/static/javascript/datetimepicker.js"></script>
    <script src="/static/javascript/column-selector.js"></script>
    <script src="/static/javascript/table.js"></script>
    <script src="/static/javascript/graph.js"></script>
    <script src="/static/javascript/suggestions_cmd.js"></script>
    <script src="/static/javascript/app.js"></script>
</head>

<body>
    <div class="layout">
        <aside id="menu">
            <!-- Left menu -->
            {% include "menu.html" %}

            <div class="ui segment">
                <div class="ui input">
                    <input type="text" id="columnSearch" placeholder="Search Fields...">
                </div>
            </div>

            <div class="ui segment" id="columnSelectorContainer">
                <button class="ui button" id="toggleSelect">Select None</button>
                <div class="ui list" id="columnSelector"></div>
            </div>
        </aside>
        <main id="content" style="width: 120%;">
                <!-- Header -->
                {% include "header.html" %}

            <!-- Central dashboard zone -->
            <div class="workspace">
                <button id="searchformbutton" class="ui button collapsible" style="margin-bottom: 10px;margin-top: -10px;">Show/Hide Panel</button>
                <form id="searchForm" class="ui form collapsed-content" style="display: block;">
                    <div class="fields">

                        <!-- Indexes field with a searchable dropdown -->
                        <div class="field">
                            <!-- <div id="dropdownindex"></div> -->
                            <div id="selectindex"></div>
                        </div>

                        <!-- Tenants field with a searchable dropdown -->
                        <div class="field">
                            <!-- <div id="dropdowntenant"></div> -->
                            <div id="selecttenant"></div>
                        </div>

                        <!-- Technologies field with a searchable dropdown -->
                        <div class="field">
                            <!-- <div id="dropdowntechnology"></div> -->
                            <div id="selecttechnology"></div>
                        </div>

                        <div class="field">
                            <date-time-picker name="Start Date" id="startPicker"></date-time-picker>

                        </div>
                        <div class="field">
                            <date-time-picker name="End Date" id="endPicker"></date-time-picker>
                        </div>

                        <div class="field">
                            <button type="button" id="downloadResults" class="styled-button" title="Export">
                                <img src="/static/media/export.png" alt="Export">
                            </button>
                        </div>

                        <div class="field">
                            <div id="loadingSpinner" class="ui active inline loader" style="display: none;"><h4 id="loadingSpinnerLabel" style="margin-left: 50px;width:200px;"></h4></div>
                        </div>
                        
                    </div>    
                        <div class="search-container">
                            <div class="field">
                                <div contenteditable="true" id="searchQuery" style="border: 1px solid #ccc; padding: 5px;" placeholder="Rechercher..."></div>
                            </div>
                            <!-- <div id="suggestions"></div> -->
                            <div class="field">
                                <button type="submit" class="styled-button" style="width: 100%;">Search</button>
                            </div>
                        </div>                    
                </form>

                <div class="table-container" id="tableContainer" hidden>
                    <div id="pagination" class="row">
                        <button id="first" title="Go to First Page" class="img-button" style="width: 128px;"><img src="/static/media/first.png" alt="First"><span style="color:white">First</span></button>
                        <button id="previous" title="Go to Previous Page" class="img-button" style="width: 128px;"><img src="/static/media/previous.png" alt="Previous"><span style="color:white">Previous</span></button>
                        <input type="number" id="currentPage" value="0" style="width: 5%;" class="ui button">
                        <button id="next" title="Go to Next Page" class="img-button" style="width: 128px;"><span style="color:white">Next</span><img src="/static/media/next.png" alt="Next"></button>
                        <button id="last" title="Go to Last Page" class="img-button" style="width: 128px;"><span style="color:white">Last</span><img src="/static/media/last.png" alt="Last"></button>
                        <select id="pageSize" title="Select Page Size" style="width:5%;">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="500">500</option>
                            <option value="1000">1000</option>
                            <option value="all">all</option>
                        </select>  
                        <div id="totalpages" class="block">Total Pages: 0</div>
                        <div id="totalitems" class="block">Total Items: 0</div>
                        <div id="startindex" class="block">Start Index: 0</div>
                        <div id="endindex" class="block">End Index: 0</div>
                    </div>

                    <table id="dataTable" class="ui celled table">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                        <tfoot id="tableFoot"></tfoot>
                    </table>
                </div>

                <div class="graph-container">
                    <canvas class="ui-graph" id="myChart"></canvas>
                </div>

                <div id="result"></div>
            </div>
        </main>   
    </div>
</body>
</html>
